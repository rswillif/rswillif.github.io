<svg class="bg-geometry" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(44, 44, 44, 0.05)" stroke-width="1"/>
        </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#grid)" />
    
    <!-- Golden Spiral / Circles -->
    <g class="geometry-layer layer-1" stroke="rgba(138, 51, 36, 0.1)" fill="none" stroke-width="1">
        <circle cx="20%" cy="20%" r="150" />
        <circle cx="20%" cy="20%" r="250" />
        <line x1="0" y1="0" x2="100%" y2="100%" />
    </g>

    <g class="geometry-layer layer-2" stroke="rgba(44, 44, 44, 0.1)" fill="none" stroke-width="1">
        <rect x="70%" y="60%" width="200" height="200" transform="rotate(45 800 600)" />
        <circle cx="80%" cy="70%" r="100" />
        <path d="M 0 500 Q 500 200 1000 800" />
    </g>
</svg>
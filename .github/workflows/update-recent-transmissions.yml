name: update-recent-transmissions

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install feedparser cloudscraper

      - name: Fetch Tweets
        run: python scripts/fetch_tweets.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # Check if data/posts.json has changed
          if [[ -n $(git status --porcelain data/posts.json) ]]; then
            echo "Changes detected. Committing..."
            git add data/posts.json
            git commit -m "Auto-update Recent Transmissions"
            git push
          else
            echo "No changes detected. Skipping commit."
          fi
